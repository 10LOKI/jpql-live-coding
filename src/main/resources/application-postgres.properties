spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gestion_commandes}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.properties.hibernate.default_schema=jpql_revision
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.hikari.connection-init-sql=CREATE SCHEMA IF NOT EXISTS jpql_revision; SET search_path TO jpql_revision
